# quality-gates T3 probe: run from main, the job that names the merge-gate environment should read its secret.
name: probe-env
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  with-environment:
    runs-on: ubuntu-latest
    environment:
      name: merge-gate
      deployment: false
    steps:
      - run: echo "secret length with environment ${#PROBE}"
        env:
          PROBE: ${{ secrets.PROBE_SECRET }}
  without-environment:
    runs-on: ubuntu-latest
    steps:
      - run: echo "secret length without environment ${#PROBE}"
        env:
          PROBE: ${{ secrets.PROBE_SECRET }}

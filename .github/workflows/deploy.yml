# Pretend deployment for the live tests of ai-orchestrator. A job with an environment makes GitHub create a deployment
# and its statuses, which GitHub for Jira shows on the items and jira-sync reads. The audit of the kit runs first, and
# the deploy job only runs when the commit came through the gates (quality-gates spec section 2.6).
# develop goes to development, release/* to staging; any environment by hand.
name: Deploy

on:
  push:
    branches: [develop, 'release/**']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, staging, production]

# audit.yml cannot raise the permissions of this token, so the run grants what the audit reads.
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit:
    uses: ./.github/workflows/audit.yml
    secrets:
      JIRA_CI_TOKEN: ${{ secrets.JIRA_CI_TOKEN }}
  deploy:
    needs: audit
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'develop' && 'development' || 'staging') }}
    steps:
      - run: echo "Pretend to deploy ${{ github.sha }} of ${{ github.ref_name }}"
